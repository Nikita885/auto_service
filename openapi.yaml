        description: A UUID string identifying this точка обслуживания.
        required: true
      tags:
      - Каталог
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePoint'
          description: ''
  /api/v1/service-points/{point_id}/categories/:
    get:
      operationId: service_points_categories_list
      description: Только включённые категории, в которых есть хотя бы одна доступная
        услуга, — и категории, где разрешено «подберите на месте». Цен и остатков
        в ответе нет.
      summary: Категории услуг на точке
      parameters:
      - in: path
        name: point_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Доступность
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceCategory'
          description: ''
  /api/v1/service-points/{point_id}/oils/:
    get:
      operationId: service_points_oils_list
      description: |-
        Масла, доступные на точке прямо сейчас.

        **Устарело.** Масла стали услугами категории «Замена масла»: берите
        `/service-points/{id}/categories/` и `/services/`. Ручка остаётся
        рабочей, пока обновляются приложения, и отвечает из тех же услуг.
      summary: Масла в наличии на точке (устарело)
      parameters:
      - in: path
        name: point_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Доступность
      security:
      - jwtAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableOil'
          description: ''
  /api/v1/service-points/{point_id}/services/:
    get:
      operationId: service_points_services_list
      description: Услуги точки, при желании — одной категории.
      summary: Услуги в наличии на точке
      parameters:
      - in: query
        name: category
        schema:
          type: string
        description: UUID категории
      - in: path
        name: point_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Доступность
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
          description: ''
  /api/v1/service-points/{point_id}/slots/:
    get:
      operationId: service_points_slots_list
      summary: Свободное время на точке
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD. Без параметра вернётся список дат, где есть свободное
          время.
      - in: path
        name: point_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Доступность
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
          description: ''
