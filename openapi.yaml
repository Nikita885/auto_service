openapi: 3.0.3
info:
  title: Автосервис — API замены масла
  version: 1.0.0
  description: 'Бэкенд записи на замену масла: вход по SMS-коду, пошаговая запись
    с черновиком на 5 минут, панель мастера.'
paths:
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Мой профиль
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Обновить профиль
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      summary: Запросить код входа по SMS
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Если аккаунта с таким телефоном ещё нет — он создаётся здесь же,
        поле is_new_user подскажет клиенту, что стоит попросить имя.
      summary: Проверить код и получить JWT
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/bookings/:
    get:
      operationId: bookings_list
      summary: Мои записи
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
        description: upcoming | history. По умолчанию — все.
      tags:
      - 'Запись: мои записи'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: bookings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - 'Запись: мои записи'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      summary: Отменить свою запись
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - 'Запись: мои записи'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/drafts/:
    post:
      operationId: bookings_drafts_create
      description: 'Возвращает существующий живой черновик, если он есть. `restart:
        true` — принудительно начать заново.'
      summary: Начать запись (создать черновик)
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDraftRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartDraftRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartDraftRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/:
    get:
      operationId: bookings_drafts_retrieve
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/cancel/:
    post:
      operationId: bookings_drafts_cancel_create
      description: Освобождает удерживаемый слот и канистру сразу, не дожидаясь таймера.
      summary: Прервать запись
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingDraftRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingDraftRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingDraftRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/confirm/:
    post:
      operationId: bookings_drafts_confirm_create
      description: Слот и наличие масла проверяются повторно. Если за время заполнения
        слот заняли — 409 `slot_taken`.
      summary: 'Шаг 4: подтвердить запись'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDraftRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmDraftRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmDraftRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/drafts/{id}/select-oil/:
    post:
      operationId: bookings_drafts_select_oil_create
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      summary: 'Шаг 2: выбрать масло'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectOilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectOilRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/select-point/:
    post:
      operationId: bookings_drafts_select_point_create
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      summary: 'Шаг 1: выбрать адрес'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectPointRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectPointRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectPointRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/select-slot/:
    post:
      operationId: bookings_drafts_select_slot_create
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      summary: 'Шаг 3: выбрать время'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectSlotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectSlotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectSlotRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/current/:
    get:
      operationId: bookings_drafts_current_retrieve
      description: 204, если активной попытки записи нет.
      summary: Текущий черновик
      tags:
      - 'Запись: черновик'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/cars/makes/:
    get:
      operationId: cars_makes_list
      description: Подсказки по маркам. Пустой запрос — список с ходовых марок.
      summary: Марки автомобилей
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Сколько позиций вернуть, до 100.
      - in: query
        name: q
        schema:
          type: string
        description: 'Часть названия в любом написании: «мерс», «merc», «Мерседес».'
      tags:
      - Автомобили
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarMake'
          description: ''
  /api/v1/cars/makes/{make_id}/models/:
    get:
      operationId: cars_makes_models_list
      description: Модели выбранной марки.
      summary: Модели марки
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Сколько позиций вернуть, до 100.
      - in: path
        name: make_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: 'Часть названия в любом написании: «мерс», «merc», «Мерседес».'
      tags:
      - Автомобили
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarModel'
          description: ''
  /api/v1/cars/search/:
    get:
      operationId: cars_search_list
      description: |-
        Поиск по маркам и моделям одной строкой.

        Человек набирает «киа рио» целиком, не разделяя на два поля, — и
        приложению не приходится угадывать, где кончилась марка.
      summary: Поиск автомобиля одной строкой
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Сколько позиций вернуть, до 100.
      - in: query
        name: q
        schema:
          type: string
        description: 'Часть названия в любом написании: «мерс», «merc», «Мерседес».'
      tags:
      - Автомобили
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarModel'
          description: ''
  /api/v1/master/bookings/:
    get:
      operationId: master_bookings_list
      summary: Список записей
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD — записи за день
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
        description: today — ближайшие сутки
      - in: query
        name: search
        schema:
          type: string
        description: Код, имя, телефон или госномер
      - in: query
        name: service_point
        schema:
          type: string
        description: UUID точки
      - in: query
        name: status
        schema:
          type: string
        description: 'Через запятую: pending,in_progress'
      tags:
      - Мастер
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMasterBookingList'
          description: ''
  /api/v1/master/bookings/{id}/:
    get:
      operationId: master_bookings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - Мастер
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterBookingDetail'
          description: ''
  /api/v1/master/bookings/{id}/cancel/:
    post:
      operationId: master_bookings_cancel_create
      description: Причина обязательна — она уходит клиенту в SMS. Уведомление отправляется
        автоматически.
      summary: Отменить запись
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - Мастер
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterCancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MasterCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MasterCancelRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterBooking'
          description: ''
  /api/v1/master/bookings/{id}/complete/:
    post:
      operationId: master_bookings_complete_create
      description: Одновременно списывает канистру масла со склада точки.
      summary: Работы выполнены
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - Мастер
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterBookingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MasterBookingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MasterBookingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterBooking'
          description: ''
  /api/v1/master/bookings/{id}/no-show/:
    post:
      operationId: master_bookings_no_show_create
      summary: Клиент не приехал
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - Мастер
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoShowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NoShowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NoShowRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterBooking'
          description: ''
  /api/v1/master/bookings/{id}/start/:
    post:
      operationId: master_bookings_start_create
      summary: Взять в работу
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - Мастер
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasterBookingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MasterBookingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MasterBookingRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterBooking'
          description: ''
  /api/v1/master/bookings/summary/:
    get:
      operationId: master_bookings_summary_retrieve
      summary: Сводка за день
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD
      tags:
      - Мастер
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DaySummary'
          description: ''
  /api/v1/master/live-drafts/:
    get:
      operationId: master_live_drafts_list
      description: |-
        Клиенты, которые записываются прямо сейчас.

        Не обязательный экран, но полезный: видно, что через минуту приедет
        ещё одна заявка, и на какое масло.
      tags:
      - Мастер
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveDraft'
          description: ''
  /api/v1/master/metrics/:
    get:
      operationId: master_metrics_retrieve
      description: 'Сводная аналитика по сети: выручка и средний чек, статусы записей,
        воронка записи, динамика по дням, загрузка по часам, сравнение точек, популярные
        позиции масла, остатки склада и клиентская база. По умолчанию — последние
        30 дней в часовом поясе сети; при фильтре по точке сутки считаются в её поясе.
        Доступно только роли `admin`.'
      summary: Метрики за период
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: YYYY-MM-DD, начало периода
      - in: query
        name: date_to
        schema:
          type: string
        description: YYYY-MM-DD, конец периода
      - in: query
        name: service_point
        schema:
          type: string
        description: UUID точки — фильтр
      tags:
      - Мастер
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
          description: ''
  /api/v1/referral/:
    get:
      operationId: referral_retrieve
      description: Код приглашения, ссылка, баланс баллов и счётчики по линиям. При
        выключенной программе приходит только enabled=false.
      summary: Моя реферальная программа
      tags:
      - Реферальная программа
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSummary'
          description: ''
  /api/v1/referral/attach/:
    post:
      operationId: referral_attach_create
      description: 'Привязка одноразовая: сменить пригласившего нельзя, иначе кто-то
        уже получил бы баллы за чужого клиента.'
      summary: Принять приглашение по коду
      tags:
      - Реферальная программа
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttachRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralSummary'
          description: ''
  /api/v1/referral/codes/{code}/:
    get:
      operationId: referral_codes_retrieve
      description: |-
        Проверка кода до входа: страница-приглашение показывает, чей он.

        Открыта без авторизации намеренно — человек переходит по ссылке ещё до
        того, как поставил приложение. Наружу уходит только имя пригласившего:
        по коду не должно быть видно ни телефона, ни размера ветки.
      summary: Чей это код приглашения
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - Реферальная программа
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/referral/invited/:
    get:
      operationId: referral_invited_list
      description: |-
        Общая база: программа только для клиентов.

        Мастеру и администратору код приглашения не нужен, а узел в матрице на
        сотруднике означал бы, что сервис начисляет баллы сам себе.
      summary: Кого я пригласил
      tags:
      - Реферальная программа
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invited'
          description: ''
  /api/v1/referral/points/:
    get:
      operationId: referral_points_list
      description: 'История баллов: начисления, списания, корректировки.'
      summary: История баллов
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - Реферальная программа
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPointsEntryList'
          description: ''
  /api/v1/service-points/:
    get:
      operationId: service_points_list
      description: 'Адреса сервиса. Открыты без авторизации: их видно ещё до входа.'
      tags:
      - Каталог
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServicePoint'
          description: ''
  /api/v1/service-points/{id}/:
    get:
      operationId: service_points_retrieve
      description: 'Адреса сервиса. Открыты без авторизации: их видно ещё до входа.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this точка обслуживания.
        required: true
      tags:
      - Каталог
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePoint'
          description: ''
  /api/v1/service-points/{point_id}/oils/:
    get:
      operationId: service_points_oils_list
      description: |-
        Масла, доступные на точке прямо сейчас.

        Живёт в booking, а не в catalog, потому что доступность зависит от
        броней и черновиков — это область записи, а не справочника.
      summary: Масла в наличии на точке
      parameters:
      - in: path
        name: point_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Доступность
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableOil'
          description: ''
  /api/v1/service-points/{point_id}/slots/:
    get:
      operationId: service_points_slots_list
      summary: Свободное время на точке
      parameters:
      - in: query
        name: date
        schema:
          type: string
        description: YYYY-MM-DD. Без параметра вернётся список дат, где есть свободное
          время.
      - in: path
        name: point_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Доступность
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
          description: ''
components:
  schemas:
    AttachRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 16
      required:
      - code
    AuthResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        is_new_user:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
      required:
      - access
      - is_new_user
      - refresh
      - user
    AvailableOil:
      type: object
      description: Масло с остатком на конкретной точке с учётом уже занятых канистр.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        brand:
          type: string
          title: Бренд
          maxLength: 80
        name:
          type: string
          title: Название
          maxLength: 120
        viscosity:
          type: string
          title: Вязкость
          description: Например, 5W-30
          maxLength: 16
        oil_type:
          allOf:
          - $ref: '#/components/schemas/OilTypeEnum'
          title: Тип
        oil_type_display:
          type: string
          readOnly: true
        volume_liters:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,1})?$
          default: '4.0'
          title: Объём канистры, л
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Цена за канистру, ₽
        work_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Стоимость работ, ₽
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        description:
          type: string
          title: Описание
        available_quantity:
          type: integer
          readOnly: true
      required:
      - available_quantity
      - brand
      - id
      - name
      - oil_type_display
      - price
      - title
      - total_price
      - viscosity
    BlankEnum:
      enum:
      - ''
    Booking:
      type: object
      description: Запись глазами клиента.
