      type: object
      properties:
        phone:
          type: string
        expires_at:
          type: string
          format: date-time
        resend_after_seconds:
          type: integer
        channel:
          allOf:
          - $ref: '#/components/schemas/OtpRequestResponseChannelEnum'
          description: |-
            call — позвоним, код — последние 4 цифры входящего номера; reverse_call — клиент сам звонит на number_to_call, код не нужен, статус — POST /auth/otp/call-status/ с session; sms — код в SMS

            * `call` - call
            * `reverse_call` - reverse_call
            * `sms` - sms
        sms_available:
          type: boolean
          description: 'Следующий код можно попросить в SMS: звонки не помогли'
        number_to_call:
          type: string
          nullable: true
          description: 'reverse_call: номер, на который звонит клиент'
        session:
          type: string
          nullable: true
          description: 'reverse_call: секрет для опроса статуса звонка, храните до
