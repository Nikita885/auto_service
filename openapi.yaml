          type: string
          minLength: 1
          title: Название
          maxLength: 120
        address:
          type: string
          minLength: 1
          title: Адрес
          maxLength: 255
        phone:
          type: string
          title: Телефон
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: Широта
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
          title: Долгота
        timezone:
          allOf:
          - $ref: '#/components/schemas/TimezoneEnum'
          title: Часовой пояс
        opens_at:
          type: string
          format: time
          title: Открытие
        closes_at:
          type: string
          format: time
          title: Закрытие
        workdays:
          title: Рабочие дни
          description: Дни недели, 0 = понедельник. Пустой список = работает всегда.
        slot_minutes:
          type: integer
          maximum: 32767
          minimum: 5
          title: Длительность слота, мин
        posts_count:
          type: integer
          maximum: 32767
          minimum: 1
          title: Постов
          description: Сколько машин обслуживается одновременно — ёмкость одного слота.
      required:
      - address
      - name
    ServiceRequest:
      type: object
      description: |-
        Услуга глазами клиента — без цен и без остатка.

        Цен клиенту не показываем нигде (решение заказчика), и убраны они из
        ответа, а не только из вёрстки: спрятанное в интерфейсе, но лежащее в
        JSON — та же публикация. Остаток — внутренняя кухня: сколько канистр
        на полке, клиента не касается.
      properties:
        name:
          type: string
          minLength: 1
          title: Название
          maxLength: 160
        description:
          type: string
          title: Описание
      required:
      - name
    Slot:
      type: object
      properties:
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        local_time:
          type: string
        free_posts:
          type: integer
      required:
      - end_at
      - free_posts
      - local_time
      - start_at
    SourceEnum:
      enum:
      - manual
      - booking
      type: string
      description: |-
        * `manual` - manual
        * `booking` - booking
    StaffLoginRequest:
      type: object
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 20
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - password
      - phone
    StartDraftRequest:
      type: object
      properties:
        restart:
          type: boolean
          default: false
          description: True — выбросить незавершённый черновик и начать заново.
    StepEnum:
      enum:
      - started
      - point_selected
      - category_selected
      - service_selected
      - oil_selected
      - slot_selected
      - confirmed
      - expired
      - cancelled
      type: string
      description: |-
        * `started` - Начата
        * `point_selected` - Выбран адрес
        * `category_selected` - Выбрана категория
        * `service_selected` - Выбрана услуга
        * `oil_selected` - Выбрано масло (устарело)
        * `slot_selected` - Выбрано время
        * `confirmed` - Подтверждена
        * `expired` - Истекла
        * `cancelled` - Отменена клиентом
    Summary:
      type: object
      properties:
        car:
          $ref: '#/components/schemas/Car'
        mileage:
          type: integer
          nullable: true
        oil_interval_km:
          type: integer
        oil_interval_months:
          type: integer
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
        month:
          $ref: '#/components/schemas/Period'
        year:
          $ref: '#/components/schemas/Period'
        fuel:
          $ref: '#/components/schemas/Fuel'
        recent:
          type: array
          items:
            $ref: '#/components/schemas/Entry'
      required:
      - car
      - fuel
      - mileage
      - month
      - oil_interval_km
      - oil_interval_months
      - recent
      - reminders
      - year
    TimezoneEnum:
      enum:
      - Europe/Kaliningrad
      - Europe/Moscow
      - Europe/Samara
      - Asia/Yekaterinburg
      - Asia/Omsk
      - Asia/Novosibirsk
      - Asia/Krasnoyarsk
      - Asia/Irkutsk
      - Asia/Yakutsk
      - Asia/Vladivostok
      - Asia/Magadan
      - Asia/Kamchatka
      type: string
      description: |-
        * `Europe/Kaliningrad` - Калининград (UTC+2)
        * `Europe/Moscow` - Москва, Санкт-Петербург (UTC+3)
        * `Europe/Samara` - Самара, Ижевск (UTC+4)
        * `Asia/Yekaterinburg` - Екатеринбург, Челябинск, Тюмень, Уфа, Пермь (UTC+5)
        * `Asia/Omsk` - Омск (UTC+6)
        * `Asia/Novosibirsk` - Новосибирск (UTC+7)
        * `Asia/Krasnoyarsk` - Красноярск, Кемерово (UTC+7)
        * `Asia/Irkutsk` - Иркутск (UTC+8)
        * `Asia/Yakutsk` - Якутск, Чита (UTC+9)
        * `Asia/Vladivostok` - Владивосток, Хабаровск (UTC+10)
        * `Asia/Magadan` - Магадан, Сахалин (UTC+11)
        * `Asia/Kamchatka` - Камчатка (UTC+12)
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
          title: Телефон
        full_name:
          type: string
          title: Имя
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Роль
        car_model:
          type: string
          readOnly: true
        car_plate:
          type: string
          readOnly: true
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
      required:
      - car_model
      - car_plate
      - date_joined
      - id
      - phone
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
