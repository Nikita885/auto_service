          readOnly: true
        is_open:
          type: boolean
          title: Активен
        is_alive:
          type: boolean
          readOnly: true
        close_reason:
          title: Причина закрытия
          oneOf:
          - $ref: '#/components/schemas/CloseReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        service_point:
