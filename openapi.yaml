        * `pending` - Ожидает
        * `in_progress` - В работе
        * `completed` - Выполнена
        * `cancelled_by_client` - Отменена клиентом
        * `cancelled_by_master` - Отменена сервисом
        * `no_show` - Клиент не приехал
    StepEnum:
      enum:
      - started
      - point_selected
      - oil_selected
      - slot_selected
      - confirmed
      - expired
      - cancelled
      type: string
      description: |-
        * `started` - Начата
        * `point_selected` - Выбран адрес
        * `oil_selected` - Выбрано масло
        * `slot_selected` - Выбрано время
        * `confirmed` - Подтверждена
        * `expired` - Истекла
        * `cancelled` - Отменена клиентом
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        phone:
          type: string
          readOnly: true
          title: Телефон
        full_name:
          type: string
          title: Имя
          maxLength: 150
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Роль
        car_model:
          type: string
          title: Марка и модель
          maxLength: 120
        car_plate:
          type: string
          title: Госномер
          maxLength: 16
        date_joined:
          type: string
          format: date-time
          readOnly: true
          title: Дата регистрации
      required:
      - date_joined
      - id
      - phone
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
