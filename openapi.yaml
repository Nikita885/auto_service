openapi: 3.0.3
info:
  title: Автосервис — API замены масла
  version: 1.0.0
  description: 'Бэкенд записи на замену масла: вход по SMS-коду, пошаговая запись
    с черновиком на 5 минут, панель мастера.'
paths:
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Мой профиль
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Обновить профиль
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/otp/call-status/:
    post:
      operationId: auth_otp_call_status_create
      description: '202 {status: pending} — звонка ещё нет, спросите снова через 2
        с. 200 — номер подтверждён, в ответе токены, как у otp/verify. 410 otp_expired
        / 400 otp_call_failed — начните вход заново.'
      summary: Статус обратного звонка (OTP_MODE=verificahub)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CallStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CallStatusRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallPending'
          description: ''
  /api/v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      description: 'По умолчанию звонок: код — последние 4 цифры входящего номера.
        После OTP_CALLS_BEFORE_SMS звонков без входа в ответе sms_available=true,
        и следующий код можно попросить в SMS (channel=sms). Номерам сотрудников —
        403 staff_use_password.'
      summary: 'Запросить код входа: звонком, после неудачных звонков — SMS'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
          description: ''
  /api/v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      description: Если аккаунта с таким телефоном ещё нет — он создаётся здесь же,
        поле is_new_user подскажет клиенту, что стоит попросить имя.
      summary: Проверить код и получить JWT
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/staff/login/:
    post:
      operationId: auth_staff_login_create
      description: Клиенту и неверному паролю — одинаково 400 invalid_credentials.
      summary: Вход сотрудника по паролю
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/bookings/:
    get:
      operationId: bookings_list
      summary: Мои записи
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
        description: upcoming | history. По умолчанию — все.
      tags:
      - 'Запись: мои записи'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: bookings_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - 'Запись: мои записи'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      summary: Отменить свою запись
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - 'Запись: мои записи'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CancelRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/{id}/reschedule/:
    post:
      operationId: bookings_reschedule_create
      description: 'Та же точка, другое время из `/service-points/{id}/slots/`. Можно,
        пока можно отменить (`can_reschedule`). Слот проверяется как при записи: занят
        — 409 `slot_taken`, поздно — 409 `reschedule_deadline_passed`.'
      summary: Перенести запись на другое время
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this запись.
        required: true
      tags:
      - 'Запись: мои записи'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RescheduleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/drafts/:
    post:
      operationId: bookings_drafts_create
      description: 'Возвращает существующий живой черновик, если он есть. `restart:
        true` — принудительно начать заново.'
      summary: Начать запись (создать черновик)
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDraftRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StartDraftRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StartDraftRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/:
    get:
      operationId: bookings_drafts_retrieve
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/cancel/:
    post:
      operationId: bookings_drafts_cancel_create
      description: Освобождает удерживаемый слот и услугу сразу, не дожидаясь таймера.
      summary: Прервать запись
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingDraftRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingDraftRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingDraftRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/confirm/:
    post:
      operationId: bookings_drafts_confirm_create
      description: Слот и доступность услуги проверяются повторно. Если за время заполнения
        слот заняли — 409 `slot_taken`. `car_id` — какую из своих машин везёт клиент;
        без него — основная.
      summary: 'Шаг 5: подтвердить запись'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDraftRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmDraftRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmDraftRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/v1/bookings/drafts/{id}/select-category/:
    post:
      operationId: bookings_drafts_select_category_create
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      summary: 'Шаг 2: выбрать категорию услуг'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectCategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/select-oil/:
    post:
      operationId: bookings_drafts_select_oil_create
      description: '**Устарело.** Выбирайте категорию и услугу: `select-category`
        и `select-service`. Ручка остаётся рабочей, пока обновляются приложения: масло
        ищется среди услуг точки, категория ставится та, в которую его перенесли.'
      summary: 'Шаг 2: выбрать масло (устарело)'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectOilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectOilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectOilRequest'
      security:
      - jwtAuth: []
      deprecated: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/select-point/:
    post:
      operationId: bookings_drafts_select_point_create
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      summary: 'Шаг 1: выбрать адрес'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectPointRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectPointRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectPointRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/select-service/:
    post:
      operationId: bookings_drafts_select_service_create
      description: '`on_site: true` — «подберите на месте»: клиент записывается без
        услуги, мастер перезвонит и выберет её. Доступно, только если категория это
        разрешает.'
      summary: 'Шаг 3: выбрать услугу'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectServiceRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectServiceRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectServiceRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/{id}/select-slot/:
    post:
      operationId: bookings_drafts_select_slot_create
      description: |-
        Пошаговая запись.

        Черновик создаётся при первом обращении и живёт 5 минут. Каждый шаг
        возвращает полное состояние — клиенту не нужно склеивать ответы.
      summary: 'Шаг 4: выбрать время'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this черновик записи.
        required: true
      tags:
      - 'Запись: черновик'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectSlotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SelectSlotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SelectSlotRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/bookings/drafts/current/:
    get:
      operationId: bookings_drafts_current_retrieve
      description: 204, если активной попытки записи нет.
      summary: Текущий черновик
      tags:
      - 'Запись: черновик'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDraft'
          description: ''
  /api/v1/cars/makes/:
    get:
      operationId: cars_makes_list
      description: Подсказки по маркам. Пустой запрос — список с ходовых марок.
      summary: Марки автомобилей
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Сколько позиций вернуть, до 100.
      - in: query
        name: q
        schema:
          type: string
        description: 'Часть названия в любом написании: «мерс», «merc», «Мерседес».'
      tags:
      - Автомобили
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarMake'
          description: ''
  /api/v1/cars/makes/{make_id}/models/:
    get:
      operationId: cars_makes_models_list
      description: Модели выбранной марки.
      summary: Модели марки
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Сколько позиций вернуть, до 100.
      - in: path
        name: make_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: 'Часть названия в любом написании: «мерс», «merc», «Мерседес».'
      tags:
      - Автомобили
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarModel'
          description: ''
  /api/v1/cars/search/:
    get:
      operationId: cars_search_list
      description: |-
        Поиск по маркам и моделям одной строкой.

        Человек набирает «киа рио» целиком, не разделяя на два поля, — и
        приложению не приходится угадывать, где кончилась марка.
      summary: Поиск автомобиля одной строкой
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: Сколько позиций вернуть, до 100.
      - in: query
        name: q
        schema:
          type: string
        description: 'Часть названия в любом написании: «мерс», «merc», «Мерседес».'
      tags:
      - Автомобили
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CarModel'
          description: ''
  /api/v1/garage/cars/:
    get:
      operationId: garage_cars_list
      summary: Мои автомобили
      tags:
      - Гараж
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Car'
          description: ''
    post:
      operationId: garage_cars_create
      description: Первый автомобиль сразу становится основным.
      summary: Добавить автомобиль
      tags:
      - Гараж
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarWriteRequest'
