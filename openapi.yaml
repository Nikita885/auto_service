        Запись глазами клиента.

        Цен до визита клиент не видит (решение заказчика): ни цены масла, ни
        работы, ни суммы записи в ответе нет. После выполнения — итог, который
        он заплатил, и как он оплачен: это его чек, а не прайс.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          title: Код записи
          maxLength: 8
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          title: Статус
        status_display:
          type: string
          readOnly: true
        service_point:
          allOf:
          - $ref: '#/components/schemas/ServicePoint'
          readOnly: true
        category_title:
          type: string
          title: Категория (снимок)
          maxLength: 120
        category_kind:
          type: string
          readOnly: true
          description: Вид категории (oil, tires, wash, service, other) — для значка
            в приложении
        service_title:
          type: string
          title: Услуги (снимок)
          maxLength: 255
        services:
          type: array
          items:
            type: string
          readOnly: true
          description: 'Услуги записи — только названия: цен клиенту не показываем'
        oil_title:
          type: string
          title: Масло (снимок)
          maxLength: 255
        oil_on_site:
          type: boolean
          readOnly: true
          description: 'Услугу подберут на месте: мастер перезвонит и выберет её вместе
            с клиентом'
        start_at:
          type: string
          format: date-time
          title: Начало
        end_at:
          type: string
          format: date-time
          title: Окончание
