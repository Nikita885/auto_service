          maxLength: 20
        channel:
          nullable: true
          description: |-
            Не передан — звонок. sms — только когда sms_available в прошлом ответе.

            * `call` - call
            * `sms` - sms
          oneOf:
          - $ref: '#/components/schemas/OtpRequestChannelEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - phone
