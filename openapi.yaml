          readOnly: true
        oil_on_site:
          type: boolean
          title: Масло подберут на месте
        slot_start:
          type: string
          format: date-time
          nullable: true
          title: Начало слота
        slot_end:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          title: Истекает
        seconds_left:
          type: integer
          readOnly: true
        booking_id:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Создано
