      properties:
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        reason:
          allOf:
          - $ref: '#/components/schemas/ReasonEnum'
          default: other
          description: |-
            Зачем звонили — причина из очереди «Кому позвонить»

            * `on_site` - Подобрать услугу
            * `callback` - Перезвонить
            * `late` - Опаздывает
            * `tomorrow` - Запись на завтра
            * `off_hours` - Запись вне рабочих часов
            * `no_show` - Не приехал
            * `other` - Другое
