          type: string
          readOnly: true
        next_action:
          type: string
          readOnly: true
          nullable: true
        progress:
          type: object
          additionalProperties: {}
          description: Сколько шагов пройдено — чтобы UI рисовал прогресс без логики.
          readOnly: true
        is_open:
          type: boolean
          title: Активен
        is_alive:
          type: boolean
          readOnly: true
        close_reason:
          title: Причина закрытия
          oneOf:
          - $ref: '#/components/schemas/CloseReasonEnum'
          - $ref: '#/components/schemas/BlankEnum'
        service_point:
          allOf:
          - $ref: '#/components/schemas/ServicePoint'
          readOnly: true
        service_category:
          allOf:
          - $ref: '#/components/schemas/ServiceCategory'
          readOnly: true
        service:
