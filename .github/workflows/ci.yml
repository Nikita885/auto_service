# Проверка на каждый push и pull request: линтер, миграции, тесты.
#
# Выкатка на сервер по-прежнему руками (`git pull` + пересоздание
# контейнеров), и до этого файла тесты гонял только тот, кто не забыл.
# Теперь красный крестик в GitHub виден до `git pull` на сервере.
#
# Тесты идут на настоящем PostgreSQL, а не на SQLite: на нём держатся
# блокировки строк (`select_for_update`) и частичные уникальные индексы,
# а SQLite первые молча игнорирует — гонки на нём не ловятся.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autoservice
          POSTGRES_USER: autoservice
          POSTGRES_PASSWORD: autoservice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoservice"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: localhost
      POSTGRES_DB: autoservice
      POSTGRES_USER: autoservice
      POSTGRES_PASSWORD: autoservice
      SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdefghij

    steps:
      - uses: actions/checkout@v4

      # Та же версия, что в Dockerfile (python:3.12-slim).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Зависимости
        run: pip install -r requirements/dev.txt

      - name: Линтер
        run: ruff check .

      - name: Проверка настроек
        run: python manage.py check

      - name: Миграции соответствуют моделям
        run: python manage.py makemigrations --check --dry-run

      - name: Тесты
        shell: bash
        run: |
          set -o pipefail
          pytest -rf 2>&1 | tee pytest.log

      - name: Аудит зависимостей
        run: pip install pip-audit && pip-audit

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Браузерные зависимости
        run: npm ci && npx playwright install --with-deps chromium

      - name: Интерфейс и восстановление сессии
        shell: bash
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ui_test
          UI_BASE_URL: http://127.0.0.1:8765
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8765 --noreload > ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/app/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:ui

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-diagnostics
          path: |
            test-results/
            ui-server.log

      # Лог шага виден только тем, кто вошёл в GitHub. Имена упавших тестов
      # выносим в аннотации — их видно на странице запуска и через API без
      # входа, и причину падения можно понять, не открывая лог.
      - name: Упавшие тесты — в аннотации
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while read -r line; do
            echo "::error title=pytest::${line}"
          done
          grep -E "^E  " pytest.log | head -20 | while read -r line; do
            echo "::error title=pytest detail::${line}"
          done

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Тесты, lint и релизный AAB
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: mobile/android/app/build/outputs/bundle/release/*.aab
