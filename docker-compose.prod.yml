# Прод-надстройка над docker-compose.yml.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Базовый файл рассчитан на разработку: он открывает наружу порты БД, Redis и
# daphne, что удобно локально и недопустимо на машине с публичным адресом.
# Здесь эти порты убираются, образ собирается без dev-зависимостей, а статика
# кладётся в каталог на хосте — оттуда её раздаёт nginx.

x-app-prod: &app-prod
  build:
    context: .
    args:
      REQUIREMENTS: prod
  volumes:
    - .:/app
    # Вместо именованных томов — каталоги хоста: nginx живёт вне Docker и
    # читать содержимое тома напрямую не может.
    - ./static:/app/static
    - ./media:/app/media

# Теги !reset и !override обязательны: списки портов Compose по умолчанию
# СКЛАДЫВАЕТ, а не заменяет. Обычный `ports: []` ничего бы не убрал, и порты из
# базового файла остались бы открытыми — тихо, без единой ошибки при запуске.
# Требуют Compose 2.24+ (проверить: docker compose version).

services:
  db:
    ports: !reset []

  redis:
    # Redis без пароля, доступный из интернета, взламывают автоматические
    # сканеры за считанные минуты. Наружу он не нужен: клиенты — только
    # контейнеры в общей сети compose.
    ports: !reset []

  api:
    <<: *app-prod
    ports: !override
      # Только петлевой интерфейс: снаружи ходят через nginx, который
      # терминирует HTTPS. Иначе сайт открывался бы и по http://IP:8000,
      # в обход сертификата.
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app-prod

  beat:
    <<: *app-prod
