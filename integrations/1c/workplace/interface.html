function walkin(){var w=ui.walkform||{},choices=[{id:'',name:'Выберите услугу'}],cats=DATA.categories||[],point=ui.point||DATA.point;for(var i=0;i<cats.length;i++)if(cats[i].service_point===point)for(var j=0;j<(cats[i].services||[]).length;j++){var srv=cats[i].services[j];if(srv.is_active)choices.push({id:srv.id,name:cats[i].name+' · '+srv.name});}var h='<section><div class="row between"><h2>Записать клиента</h2><button data-local="close-walkin">Назад к заказам</button></div><div class="fields">'+input('Телефон клиента','walk_phone',w.phone||'','tel')+input('Имя клиента','walk_full_name',w.full_name||'')+'</div><div class="actions-bottom">'+action('lookup-client','Найти по телефону')+'</div><div class="fields">'+input('Автомобиль','walk_car_model',w.car_model||'')+input('Госномер · необязательно','walk_car_plate',w.car_plate||'')+select('Услуга','walk_service',choices,w.service||'')+input('Дата','walk_day',w.day||ui.day||DATA.day,'date')+input('Комментарий','walk_comment',w.comment||'')+'</div><div class="actions-bottom">'+action('walkin-slots','Показать свободное время')+'</div><div class="row actions-bottom">';var slots=DATA.walkin_slots||[];for(i=0;i<slots.length;i++)h+='<button data-local="walk-slot" data-value="'+esc(slots[i].start_at)+'" class="'+(w.start_at===slots[i].start_at?'primary':'')+'">'+esc(slots[i].local_time)+'</button>';h+='</div><div class="actions-bottom">'+action('create-booking','Создать запись и открыть заказ','primary '+(!w.start_at||!w.service||!w.phone||!w.full_name?'disabled':''))+'</div></section>';return h;}

if(!disabled){h+='<div class="row actions-bottom">'+select('Подбор','catalog_kind',[{id:'work',name:'Работы и услуги'},{id:'material',name:'Товары и расходные материалы'}],ui.catalog_kind||'work')+input('Наименование или артикул','product_query',ui.product_query||'')+action('products','Найти в 1С')+'</div>';var products=DATA.products||[];if(products.length){h+='<div class="catalog-list">';for(var p=0;p<products.length;p++)h+='<button data-local="add-product" data-index="'+p+'" class="catalog-item"><span>'+esc(products[p].name)+'</span><span class="catalog-price">'+money(products[p].price)+' / '+esc(products[p].unit)+'</span></button>';h+='</div>';}}

return h+(!n?'<tr><td colspan="6" class="muted">Пока нет строк</td></tr>':'')+'</tbody></table></div>';}
function checkout(t){var point=num(t.checkout.points),due=Math.round((total(t)-point)*100)/100,method=t.checkout.method||'card',cash=method==='cash'?due:method==='card'?0:num(t.checkout.cash),card=Math.round((due-cash)*100)/100,valid=total(t)>0&&point>=0&&point<=num((t.quote||{}).max_spend)&&cash>=0&&card>=0;t.checkout.cash_amount=cash;t.checkout.card_amount=card;var disabled=locked(t),h='<section class="checkout"><div class="row between"><h3>Расчёт и кассовый чек</h3><button data-local="close-checkout">Свернуть</button></div><div class="fields">'+input('Баллы · доступно '+money((t.quote||{}).max_spend),'pay_points',point,'number','min="0" step="0.01" '+(disabled?'disabled':''))+select('Способ оплаты','pay_method',[{id:'card',name:'Карта'},{id:'cash',name:'Наличные'},{id:'mixed',name:'Наличные + карта'}],method)+(method==='mixed'?input('Наличными, ₽','pay_cash',cash,'number','min="0" step="0.01" '+(disabled?'disabled':'')):'')+'</div><div class="pay-split">Наличные: '+money(cash)+' · Карта: '+money(card)+' · Баллы: '+money(point)+'</div><div class="receipt">';for(var i=0;i<t.lines.length;i++){var l=t.lines[i];h+='<div class="row between"><span>'+esc(l.name)+' · '+esc(l.quantity)+' '+esc(l.unit)+'</span><span>'+money(lineAmount(l))+'</span></div>';}h+='</div><div class="footer"><div><div class="muted">К оплате деньгами</div><div class="amount" data-due> '+money(due)+'</div></div><span class="grow"></span>';
if(!disabled)h+=action('pay','Принять оплату и напечатать чек','primary '+(!valid?'disabled':''));else if(t.order.state!=='completed'&&t.order.state!=='review')h+=action('resume','Продолжить расчёт','primary');h+='</div>'+(!valid&&!disabled?'<p class="bad">Проверьте баллы и распределение оплаты.</p>':'')+'<p class="muted" style="margin-top:10px">Состав чека — работы и материалы отдельными строками.</p></section>';return h;}
function collect(){var t=active(),nodes=root.querySelectorAll('[data-field]');for(var i=0;i<nodes.length;i++){var node=nodes[i],key=node.getAttribute('data-field'),v=node.value;if(key==='point'||key==='day'||key==='search'||key==='product_query'||key==='catalog_kind')ui[key]=v;else if(key.indexOf('walk_')===0){ui.walkform=ui.walkform||{};ui.walkform[key.slice(5)]=v;}else if(t){if(key==='booking_reason')t.booking_reason=v;else if(key==='service')t.service=v;else if(key==='start_local'){if(t.start_local!==v)delete t.start_at;t.start_local=v;}else if(key==='recommendations')t.recommendations=v;else if(key==='pay_method')t.checkout.method=v;else if(key==='pay_cash')t.checkout.cash=v;else if(key==='pay_points')t.checkout.points=v;else if(key==='comment')t.booking.client_comment=v;else if(key.indexOf('setting_')!==0&&key!=='url'&&key!=='phone'&&key!=='password')t.booking[key]=v;}}
var lines=root.querySelectorAll('[data-line]');for(i=0;i<lines.length;i++)if(t){var l=t.lines[Number(lines[i].getAttribute('data-line'))],k=lines[i].getAttribute('data-key');if(String(l[k])!==lines[i].value)delete l.amount;l[k]=lines[i].value;};}
function buildRequest(node,name){var t=active(),j;var payload={id:node.getAttribute('data-id')||ui.active,tab:t,point:ui.point||DATA.point,day:ui.day||DATA.day,query:ui.product_query||'',kind:ui.catalog_kind||'work'};if(name==='login'){payload.url=document.getElementById('url').value;payload.phone=document.getElementById('phone').value;payload.password=document.getElementById('password').value;}if(name==='save-settings'){payload.settings={};var selects=root.querySelectorAll('select[data-field]');for(j=0;j<selects.length;j++)payload.settings[selects[j].getAttribute('data-field').replace('setting_','')]=selects[j].value;}if(t&&name!=='refresh'&&name!=='save-settings'&&name!=='walkin'&&name!=='create-booking'&&name!=='walkin-slots'&&name!=='lookup-client')payload.point=t.booking.service_point;if(t&&(name==='cancel'||name==='no-show'))payload.reason=t.booking_reason||'';if(name==='create-booking'){var w=ui.walkform||{};payload.booking={phone:w.phone||'',full_name:w.full_name||'',car_model:w.car_model||'',car_plate:w.car_plate||'',service_point:ui.point||DATA.point,service:w.service||null,start_at:w.start_at||'',comment:w.comment||''};}if(name==='lookup-client')payload.phone=(ui.walkform||{}).phone||'';if(name==='walkin-slots')payload.day=(ui.walkform||{}).day||ui.day||DATA.day;if(t&&t.checkout){payload.points=t.checkout.points||0;payload.cash=t.checkout.cash_amount;payload.card=t.checkout.card_amount;}
var encoded=encodeURIComponent(JSON.stringify({command:name,payload:payload,ui:ui}));node.name=encoded;node.href='about:blank#ms='+encoded;}
root.onclick=function(e){e=e||window.event;var node=e.target||e.srcElement;while(node&&node!==root&&!node.getAttribute('data-action')&&!node.getAttribute('data-local'))node=node.parentNode;if(!node||node===root)return;collect();var local=node.getAttribute('data-local'),name=node.getAttribute('data-action'),t=active();if(local){if(local==='close-tab'){for(var ci=0;ci<ui.tabs.length;ci++)if(ui.tabs[ci].booking.id===node.getAttribute('data-id')){if(ui.tabs[ci].dirty&&!window.confirm('Закрыть заказ без сохранения изменений?'))return false;ui.tabs.splice(ci,1);if(ui.active===node.getAttribute('data-id'))ui.active=ui.tabs.length?ui.tabs[Math.max(0,ci-1)].booking.id:null;break;}}if(local==='filter')ui.filter=node.getAttribute('data-value');if(local==='tab')ui.active=node.getAttribute('data-id');if(local==='close-settings')ui.settings=false;if(local==='close-walkin')ui.walkin=false;if(local==='walk-slot'){ui.walkform=ui.walkform||{};ui.walkform.start_at=node.getAttribute('data-value');} if(local==='close-checkout'&&t)t.checkout=null;if(local==='slot'&&t){t.start_at=node.getAttribute('data-value');t.start_local=(t.start_local||localStart(t.booking)).slice(0,10)+'T'+node.textContent.slice(0,5);}if(local==='remove-line'&&t){t.lines.splice(Number(node.getAttribute('data-index')),1);t.dirty=true;}if(local==='add-product'&&t){var item=DATA.products[Number(node.getAttribute('data-index'))];t.lines.push({ref:item.ref,name:item.name,kind:item.kind,unit:item.unit,quantity:'1',price:String(item.price)});t.dirty=true;}render();return false;}
if(t&&locked(t)&&(name==='save-booking'||name==='save-order'||name==='products'||name==='pay'||name==='start'||name==='cancel'||name==='no-show'))return false;if(name==='settings'){ui.settings=!ui.settings;render();return false;}if((name==='cancel'||name==='no-show')&&!window.confirm(name==='cancel'?'Отменить запись? Клиент получит уведомление.':'Отметить, что клиент не приехал?'))return false;if(name==='reload-order'&&t&&t.dirty&&!window.confirm('Перечитать заказ? Несохранённые изменения этого заказа будут потеряны.'))return false;if(name==='logout'&&!window.confirm('Выйти? Несохранённые изменения открытых заказов будут потеряны.'))return false;if(name==='open'){for(var j=0;j<ui.tabs.length;j++)if(ui.tabs[j].booking.id===node.getAttribute('data-id')){ui.active=ui.tabs[j].booking.id;render();return false;}}
buildRequest(node,name);return true;};
root.onmousedown=function(e){var node=e.target||e.srcElement;while(node&&node!==root&&!node.getAttribute('data-action'))node=node.parentNode;if(!node||node===root)return;var name=node.getAttribute('data-action');if(name==='settings'||name==='reload-order'||name==='logout'||name==='cancel'||name==='no-show')return;if(name==='open')for(var i=0;i<ui.tabs.length;i++)if(ui.tabs[i].booking.id===node.getAttribute('data-id'))return;collect();buildRequest(node,name);};
root.onkeydown=function(e){var key=e.key||e.keyCode,node=e.target||e.srcElement;if(key==='Enter'||key===13){if(node.id==='product_query'){root.querySelector('[data-action=products]').click();return false;}if(node.id==='password'){root.querySelector('[data-action=login]').click();return false;}if(node.getAttribute('data-action')&&node.getAttribute('data-action')!=='reload-order'&&node.getAttribute('data-action')!=='logout'){collect();buildRequest(node,node.getAttribute('data-action'));}}};
root.onchange=function(e){var node=e.target||e.srcElement;if(node.getAttribute('data-line')!=null||node.getAttribute('data-field')){collect();var t=active(),key=node.getAttribute('data-field')||'';if(t&&key.indexOf('pay_')!==0&&key!=='search'&&key!=='point'&&key!=='day'&&key.indexOf('setting_')!==0)t.dirty=true;if(key==='walk_day'){delete ui.walkform.start_at;DATA.walkin_slots=[];render();return;}if(key==='point'){ui.walkform={};DATA.walkin_slots=[];}if(key==='point'||key==='day'){root.querySelector('[data-action=refresh]').click();return;}if(key==='pay_method')render();else recalc();}};
function recalc(){var t=active();if(!t)return;var totals=root.querySelectorAll('[data-total]');for(var i=0;i<totals.length;i++)totals[i].textContent=money(total(t));var cells=root.querySelectorAll('[data-line-total]');for(i=0;i<cells.length;i++)cells[i].textContent=money(lineAmount(t.lines[Number(cells[i].getAttribute('data-line-total'))]));if(t.checkout){var pts=num(t.checkout.points),due=Math.round((total(t)-pts)*100)/100,m=t.checkout.method||'card',cash=m==='cash'?due:m==='card'?0:num(t.checkout.cash),card=Math.round((due-cash)*100)/100;t.checkout.cash_amount=cash;t.checkout.card_amount=card;var v=total(t)>0&&pts>=0&&pts<=num((t.quote||{}).max_spend)&&cash>=0&&card>=0;var pay=root.querySelector('[data-action=pay]');if(pay)pay.className='action primary '+(v?'':'disabled');var dueNode=root.querySelector('[data-due]');if(dueNode)dueNode.textContent=money(due);var split=root.querySelector('.pay-split');if(split)split.textContent='Наличные: '+money(cash)+' · Карта: '+money(card)+' · Баллы: '+money(pts);}}
root.oninput=function(e){var node=e.target||e.srcElement;if(node.getAttribute('data-line')!=null||(node.getAttribute('data-field')||'').indexOf('pay_')===0){collect();recalc();}if(node.getAttribute('data-field')==='search'){var pos=node.selectionStart;collect();render();var field=document.getElementById('search');field.focus();if(field.setSelectionRange)field.setSelectionRange(pos,pos);}};
render();
})();
