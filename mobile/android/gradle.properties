org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ------------------------------------------------------- кириллица в пути
# Репозиторий лежит по пути с кириллицей (…/автосервис/…), и AGP на Windows
# отказывается собирать: часть его инструментов исторически спотыкается о
# не-ASCII. Для чистого Java-проекта без NDK проверка избыточна, поэтому
# снимаем её.
#
# Если сборка всё же упадёт на aapt2 или R8 с непонятной ошибкой про путь —
# причина именно в кириллице, и флагом её больше не обойти. Тогда сделайте
# ASCII-ссылку на эту папку и открывайте студию по ней. В cmd от имени
# администратора, одной строкой:
#
#   mklink /J C:\dev\autoservice-android "F:\автосервис\auto_service\mobile\android"
#
# Ссылка указывает на ту же папку: правки видны в git, отдельной копии нет.
android.overridePathCheck=true

# ---------------------------------------------------------------- подпись
# Значения для релизной подписи берутся отсюда, а сам файл с реальными
# паролями в репозиторий не попадает (см. .gitignore и README).
# Заполняются в ~/.gradle/gradle.properties или в CI-секретах:
#
# RELEASE_STORE_FILE=/абсолютный/путь/keystore.jks
# RELEASE_STORE_PASSWORD=...
# RELEASE_KEY_ALIAS=upload
# RELEASE_KEY_PASSWORD=...
