plugins {
    id 'com.android.application'
}

// Каталог сборки можно вынести в другое место: -PBUILD_DIR=C:/dev/asbuild.
// Нужно, когда проект лежит по пути с не-ASCII символами — часть
// инструментов Android на Windows такие пути не переваривает.
if (project.hasProperty('BUILD_DIR')) {
    layout.buildDirectory.set(file("${project.property('BUILD_DIR')}/app"))
}

android {
    namespace 'ru.autoservice.client'
    compileSdk 35

    defaultConfig {
        applicationId "ru.autoservice.client"
        minSdk 24
        targetSdk 35

        // versionCode обязан расти при каждой загрузке в Play Console.
        // 2 — оболочка над веб-приложением вместо нативных экранов.
        versionCode 2
        versionName "2.0.0"

        resConfigs "ru"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        release {
            // Подпись берётся из ~/.gradle/gradle.properties или из секретов CI.
            // Ключ в репозитории не лежит: утечка upload-ключа означает, что
            // кто угодно сможет выложить обновление вашего приложения.
            def storePath = project.findProperty('RELEASE_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword project.findProperty('RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"

            // Адрес сайта для отладки задаётся снаружи — значением в
            // gradle.properties или флагом -P при сборке. По умолчанию это
            // 10.0.2.2: так эмулятор видит localhost хост-машины. Оболочка
            // открывает `<адрес>/app/`.
            //
            //   боевой сервер:         -PDEBUG_API_URL=https://moi-servis.ru/
            //   телефон в той же сети: -PDEBUG_API_URL=http://192.168.1.10:8000/
            //
            // Менять код ради смены адреса не нужно: иначе правка однажды
            // уедет в релиз вместе с чьим-то домашним IP. DEBUG_WS_URL больше
            // не нужен (канал открывает сама страница), флаг просто не читается.
            def debugSite = project.findProperty('DEBUG_API_URL') ?: 'http://10.0.2.2:8000/'

            buildConfigField "String", "SITE_URL", "\"${debugSite}\""
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Подпись подключается только когда ключ реально настроен: иначе
            // сборка релиза падала бы у любого, кто просто хочет проверить,
            // что R8 ничего лишнего не вырезал.
            if (project.findProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }

            // Боевой домен, только https. Именно основной, а не редиректящий:
            // оболочка пускает к мосту только свой домен, и после 301 на
            // основной страница оказалась бы «чужой».
            buildConfigField "String", "SITE_URL", '"https://moi-servis.ru/"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Исходники в UTF-8, а javac на Windows по умолчанию читает файлы в
        // системной кодировке: без этого комментарии и русские строки
        // превращаются в мусор, а иногда ломается и сам class-файл.
        encoding "UTF-8"
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'DEBUG', 'LICENSE.txt']
    }
}

// Путь проекта содержит кириллицу, а JVM тестового воркера читает classpath в
// системной кодировке Windows: без явного UTF-8 он просто не находит классы и
// падает с ClassNotFoundException ещё до запуска тестов.
tasks.withType(Test).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
    testLogging {
        events "passed", "failed", "skipped"
    }
}

dependencies {
    // Оболочка: активность, заставка, отступы под системные панели.
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    // Одна версия всех частей kotlin-stdlib. Без этого appcompat тянет
    // stdlib 1.8, а splashscreen — старые stdlib-jdk7/jdk8 1.6 с теми же
    // классами, и сборка падает на дублях (раньше их выравнивала material).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    // Токены лежат в EncryptedSharedPreferences (ключ — в Android Keystore),
    // а не в localStorage WebView.
    implementation 'androidx.security:security-crypto:1.0.0'

    // Код приглашения, с которым приложение установили из Google Play
    // (ссылка на магазин с сайта несёт referrer=invite=<код>).
    implementation 'com.android.installreferrer:installreferrer:2.2'

    testImplementation 'junit:junit:4.13.2'
}
