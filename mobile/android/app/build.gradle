plugins {
    id 'com.android.application'
}

// Каталог сборки можно вынести в другое место: -PBUILD_DIR=C:/dev/asbuild.
// Нужно, когда проект лежит по пути с не-ASCII символами — часть
// инструментов Android на Windows такие пути не переваривает.
if (project.hasProperty('BUILD_DIR')) {
    layout.buildDirectory.set(file("${project.property('BUILD_DIR')}/app"))
}

android {
    namespace 'ru.autoservice.client'
    compileSdk 35

    defaultConfig {
        applicationId "ru.autoservice.client"
        minSdk 24
        targetSdk 35

        // versionCode обязан расти при каждой загрузке в Play Console.
        versionCode 1
        versionName "1.0.0"

        resConfigs "ru"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        release {
            // Подпись берётся из ~/.gradle/gradle.properties или из секретов CI.
            // Ключ в репозитории не лежит: утечка upload-ключа означает, что
            // кто угодно сможет выложить обновление вашего приложения.
            def storePath = project.findProperty('RELEASE_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword project.findProperty('RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"

            // Адрес сервера для отладки задаётся снаружи — значением в
            // gradle.properties или флагом -P при сборке. По умолчанию это
            // 10.0.2.2: так эмулятор видит localhost хост-машины.
            //
            //   телефон в той же сети: -PDEBUG_API_URL=http://192.168.1.10:8000/
            //   туннель наружу:        -PDEBUG_API_URL=https://xxx.trycloudflare.com/
            //
            // Менять код ради смены адреса не нужно: иначе правка однажды
            // уедет в релиз вместе с чьим-то домашним IP.
            def debugApi = project.findProperty('DEBUG_API_URL') ?: 'http://10.0.2.2:8000/'
            def debugWs = project.findProperty('DEBUG_WS_URL') ?: 'ws://10.0.2.2:8000/'

            buildConfigField "String", "API_BASE_URL", "\"${debugApi}\""
            buildConfigField "String", "WS_BASE_URL", "\"${debugWs}\""
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Подпись подключается только когда ключ реально настроен: иначе
            // сборка релиза падала бы у любого, кто просто хочет проверить,
            // что R8 ничего лишнего не вырезал.
            if (project.findProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }

            // Боевой домен. Только https и wss: по открытому каналу уходит JWT.
            // Здесь нужен именно основной домен, а не один из редиректящих:
            // браузер редирект отработает, а OkHttp с JWT в заголовке — нет.
            buildConfigField "String", "API_BASE_URL", '"https://moiservis.pro/"'
            buildConfigField "String", "WS_BASE_URL", '"wss://moiservis.pro/"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Исходники в UTF-8, а javac на Windows по умолчанию читает файлы в
        // системной кодировке: без этого комментарии и русские строки
        // превращаются в мусор, а иногда ломается и сам class-файл.
        encoding "UTF-8"
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.kotlin_module', 'DEBUG', 'LICENSE.txt']
    }
}

// Путь проекта содержит кириллицу, а JVM тестового воркера читает classpath в
// системной кодировке Windows: без явного UTF-8 он просто не находит классы и
// падает с ClassNotFoundException ещё до запуска тестов.
tasks.withType(Test).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8', '-Dsun.jnu.encoding=UTF-8'
    testLogging {
        events "passed", "failed", "skipped"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'

    // MVVM: состояние экрана переживает поворот и не течёт в Activity.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'

    // Сеть. Logging-интерфейс подключён, но включается только в debug.
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Токены лежат в EncryptedSharedPreferences, а не в обычных настройках.
    implementation 'androidx.security:security-crypto:1.0.0'

    // Генерация QR-кода приглашения. Единственная сторонняя библиотека,
    // добавленная ради одной функции, и это оправдано: кодирование QR —
    // это коды Рида — Соломона, маски и таблицы версий, полтысячи строк
    // математики, в которой ошибка не видна глазом. `core` без android-
    // обвязки: рисуем битмап сами, камера нам не нужна.
    implementation 'com.google.zxing:core:3.5.3'

    // Сканер QR приглашения: готовый экран камеры поверх того же zxing.
    // Свой экран камеры с автофокусом и поворотами — сотни строк ради
    // одной кнопки.
    implementation('com.journeyapps:zxing-android-embedded:4.3.0') { transitive = false }

    // Код приглашения, с которым приложение установили из Google Play
    // (ссылка на магазин с сайта несёт referrer=invite=<код>).
    implementation 'com.android.installreferrer:installreferrer:2.2'

    testImplementation 'junit:junit:4.13.2'
}
